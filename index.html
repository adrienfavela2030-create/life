<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Store Shift VR</title>

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <!-- Loading screen -->
  <div id="loadingScreen">
    <div class="loadingBox">
      <div class="logo">STORE SHIFT VR</div>
      <div id="loadingText">Loading store...</div>
      <div class="loadingBar">
        <div id="loadingProgress"></div>
      </div>
    </div>
  </div>

  <!-- Main menu -->
  <div id="mainMenu" class="hidden">
    <div class="menuBox">
      <h1>STORE SHIFT VR</h1>
      <p class="subtitle">Your shift starts now.</p>

      <button id="startButton">
        START SHIFT
      </button>

      <button id="settingsButton">
        SETTINGS
      </button>

      <div class="version">
        WebXR Edition
      </div>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="gameHUD" class="hidden">

    <div class="hudTop">
      <div>
        SHIFT
        <strong id="shiftNumber">1</strong>
      </div>

      <div>
        MONEY
        <strong>$<span id="moneyAmount">0.00</span></strong>
      </div>
    </div>

    <div id="orderDisplay">
      <div class="orderTitle">CURRENT CUSTOMER</div>
      <div id="customerOrder">
        Waiting for customer...
      </div>
    </div>

    <div id="messageBox"></div>

  </div>

  <!-- Error message -->
  <div id="errorScreen" class="hidden">
    <div class="errorBox">
      <h2>Something went wrong</h2>
      <p id="errorText">
        The game could not start.
      </p>

      <button id="reloadButton">
        RELOAD
      </button>
    </div>
  </div>

  <script type="module">

    import * as THREE from "three";

    import { VRButton } from "three/addons/webxr/VRButton.js";

    import { XRControllerModelFactory }
      from "three/addons/webxr/XRControllerModelFactory.js";

    import { XRHandModelFactory }
      from "three/addons/webxr/XRHandModelFactory.js";


    /*
     * ---------------------------------------------------------
     * STORE SHIFT VR
     * Main application
     * ---------------------------------------------------------
     */

    const S = window.StoreShiftVR = {

      THREE,

      scene: null,
      camera: null,
      renderer: null,

      player: null,

      controllers: [],
      controllerGrips: [],
      hands: [],

      systems: {
        game: null,
        physics: null,
        store: null,
        customers: null
      },

      started: false,
      loading: true,

      money: 0,
      shift: 1,

      currentOrder: null,

      clock: new THREE.Clock(),

      settings: {
        shadows: true,
        quality: "high"
      }

    };


    /*
     * ---------------------------------------------------------
     * DOM
     * ---------------------------------------------------------
     */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const loadingText =
      document.getElementById("loadingText");

    const loadingProgress =
      document.getElementById("loadingProgress");

    const mainMenu =
      document.getElementById("mainMenu");

    const gameHUD =
      document.getElementById("gameHUD");

    const errorScreen =
      document.getElementById("errorScreen");

    const errorText =
      document.getElementById("errorText");

    const startButton =
      document.getElementById("startButton");

    const reloadButton =
      document.getElementById("reloadButton");

    const settingsButton =
      document.getElementById("settingsButton");

    const shiftNumber =
      document.getElementById("shiftNumber");

    const moneyAmount =
      document.getElementById("moneyAmount");

    const customerOrder =
      document.getElementById("customerOrder");

    const messageBox =
      document.getElementById("messageBox");


    /*
     * ---------------------------------------------------------
     * LOADING
     * ---------------------------------------------------------
     */

    function setLoading(percent, text) {

      loadingProgress.style.width =
        Math.max(0, Math.min(100, percent)) + "%";

      loadingText.textContent = text;
    }


    /*
     * ---------------------------------------------------------
     * ERROR HANDLING
     * ---------------------------------------------------------
     */

    function showError(error) {

      console.error(error);

      loadingScreen.classList.add("hidden");
      mainMenu.classList.add("hidden");

      errorScreen.classList.remove("hidden");

      errorText.textContent =
        error?.message ||
        "Unknown error.";
    }


    /*
     * ---------------------------------------------------------
     * THREE.JS SETUP
     * ---------------------------------------------------------
     */

    function createScene() {

      S.scene =
        new THREE.Scene();

      S.scene.background =
        new THREE.Color(0x87a9b8);


      /*
       * Camera
       */

      S.camera =
        new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.01,
          1000
        );


      /*
       * Player rig
       */

      S.player =
        new THREE.Group();

      S.player.name =
        "PlayerRig";

      S.player.position.set(
        0,
        1.6,
        4
      );

      S.player.add(
        S.camera
      );

      S.scene.add(
        S.player
      );


      /*
       * Renderer
       */

      S.renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: false
        });

      S.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      S.renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      S.renderer.xr.enabled = true;

      S.renderer.xr.setReferenceSpaceType(
        "local-floor"
      );

      S.renderer.shadowMap.enabled = true;

      S.renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

      document.body.appendChild(
        S.renderer.domElement
      );


      /*
       * VR button
       */

      const vrButton =
        VRButton.createButton(
          S.renderer
        );

      vrButton.style.zIndex = "20";

      document.body.appendChild(
        vrButton
      );


      /*
       * Basic lighting
       */

      const ambient =
        new THREE.HemisphereLight(
          0xffffff,
          0x404040,
          2
        );

      S.scene.add(
        ambient
      );


      const light =
        new THREE.DirectionalLight(
          0xffffff,
          3
        );

      light.position.set(
        5,
        10,
        5
      );

      light.castShadow = true;

      light.shadow.mapSize.width = 2048;
      light.shadow.mapSize.height = 2048;

      S.scene.add(
        light
      );


      /*
       * Controllers
       */

      setupControllers();


      /*
       * Resize
       */

      window.addEventListener(
        "resize",
        onResize
      );
    }


    /*
     * ---------------------------------------------------------
     * CONTROLLERS + HANDS
     * ---------------------------------------------------------
     */

    function setupControllers() {

      const controllerFactory =
        new XRControllerModelFactory();

      const handFactory =
        new XRHandModelFactory();


      for (let i = 0; i < 2; i++) {

        const controller =
          S.renderer.xr.getController(i);

        controller.userData.hand =
          i === 0 ? "left" : "right";

        S.player.add(
          controller
        );

        S.controllers.push(
          controller
        );


        const grip =
          S.renderer.xr.getControllerGrip(i);

        grip.userData.hand =
          i === 0 ? "left" : "right";

        const controllerModel =
          controllerFactory.createControllerModel(
            grip
          );

        grip.add(
          controllerModel
        );

        S.player.add(
          grip
        );

        S.controllerGrips.push(
          grip
        );


        /*
         * Hand tracking
         */

        const hand =
          S.renderer.xr.getHand(i);

        const handModel =
          handFactory.createHandModel(
            hand,
            "mesh"
          );

        hand.add(
          handModel
        );

        S.player.add(
          hand
        );

        S.hands.push(
          hand
        );


        /*
         * Select
         */

        controller.addEventListener(
          "selectstart",
          () => {

            if (
              S.systems.physics &&
              S.systems.physics.grab
            ) {

              S.systems.physics.grab(
                controller
              );

            }

          }
        );


        controller.addEventListener(
          "selectend",
          () => {

            if (
              S.systems.physics &&
              S.systems.physics.release
            ) {

              S.systems.physics.release(
                controller
              );

            }

          }
        );


        /*
         * Squeeze
         */

        controller.addEventListener(
          "squeezestart",
          () => {

            if (
              S.systems.physics &&
              S.systems.physics.squeeze
            ) {

              S.systems.physics.squeeze(
                controller
              );

            }

          }
        );

      }

    }


    /*
     * ---------------------------------------------------------
     * GAME START
     * ---------------------------------------------------------
     */

    async function startGame() {

      if (S.started) {
        return;
      }

      try {

        startButton.disabled = true;

        showMessage(
          "Starting your shift..."
        );


        /*
         * Start main game system
         */

        if (
          S.systems.game &&
          S.systems.game.start
        ) {

          await S.systems.game.start(
            S
          );

        }


        /*
         * Start physics
         */

        if (
          S.systems.physics &&
          S.systems.physics.start
        ) {

          await S.systems.physics.start(
            S
          );

        }


        /*
         * Build store
         */

        if (
          S.systems.store &&
          S.systems.store.start
        ) {

          await S.systems.store.start(
            S
          );

        }


        /*
         * Start customers
         */

        if (
          S.systems.customers &&
          S.systems.customers.start
        ) {

          await S.systems.customers.start(
            S
          );

        }


        S.started = true;


        mainMenu.classList.add(
          "hidden"
        );

        gameHUD.classList.remove(
          "hidden"
        );


        updateHUD();

        showMessage(
          "Your shift has started."
        );


        /*
         * If VR isn't active yet, the player
         * can press the VR button.
         */

        console.log(
          "Store Shift VR started."
        );

      }

      catch (error) {

        showError(error);

      }

    }


    /*
     * ---------------------------------------------------------
     * GAME LOOP
     * ---------------------------------------------------------
     */

    function gameLoop() {

      const delta =
        Math.min(
          S.clock.getDelta(),
          0.05
        );


      /*
       * Main game
       */

      if (
        S.systems.game &&
        S.systems.game.update
      ) {

        S.systems.game.update(
          delta,
          S
        );

      }


      /*
       * Physics
       */

      if (
        S.systems.physics &&
        S.systems.physics.update
      ) {

        S.systems.physics.update(
          delta,
          S
        );

      }


      /*
       * Store
       */

      if (
        S.systems.store &&
        S.systems.store.update
      ) {

        S.systems.store.update(
          delta,
          S
        );

      }


      /*
       * Customers
       */

      if (
        S.systems.customers &&
        S.systems.customers.update
      ) {

        S.systems.customers.update(
          delta,
          S
        );

      }


      /*
       * Render
       */

      S.renderer.render(
        S.scene,
        S.camera
      );

    }


    /*
     * ---------------------------------------------------------
     * HUD
     * ---------------------------------------------------------
     */

    function updateHUD() {

      shiftNumber.textContent =
        S.shift;

      moneyAmount.textContent =
        Number(S.money).toFixed(2);


      if (S.currentOrder) {

        customerOrder.textContent =
          S.currentOrder.text ||
          "Customer order";

      }
      else {

        customerOrder.textContent =
          "Waiting for customer...";

      }

    }


    function showMessage(text) {

      messageBox.textContent =
        text;

      messageBox.classList.add(
        "visible"
      );

      clearTimeout(
        showMessage.timer
      );

      showMessage.timer =
        setTimeout(() => {

          messageBox.classList.remove(
            "visible"
          );

        }, 3000);

    }


    /*
     * ---------------------------------------------------------
     * MONEY
     * ---------------------------------------------------------
     */

    S.addMoney = function(amount) {

      const value =
        Number(amount);

      if (
        !Number.isFinite(value)
      ) {
        return;
      }

      S.money += value;

      updateHUD();

    };


    /*
     * ---------------------------------------------------------
     * ORDER
     * ---------------------------------------------------------
     */

    S.setOrder = function(order) {

      S.currentOrder =
        order || null;

      updateHUD();

    };


    S.clearOrder = function() {

      S.currentOrder =
        null;

      updateHUD();

    };


    /*
     * ---------------------------------------------------------
     * RESIZE
     * ---------------------------------------------------------
     */

    function onResize() {

      if (!S.camera || !S.renderer) {
        return;
      }

      S.camera.aspect =
        window.innerWidth /
        window.innerHeight;

      S.camera.updateProjectionMatrix();

      S.renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }


    /*
     * ---------------------------------------------------------
     * BUTTONS
     * ---------------------------------------------------------
     */

    startButton.addEventListener(
      "click",
      startGame
    );


    reloadButton.addEventListener(
      "click",
      () => {
        window.location.reload();
      }
    );


    settingsButton.addEventListener(
      "click",
      () => {

        showMessage(
          "Settings will be added later."
        );

      }
    );


    /*
     * ---------------------------------------------------------
     * LOAD THE OTHER GAME FILES
     * ---------------------------------------------------------
     */

    async function loadSystems() {

      setLoading(
        15,
        "Loading game..."
      );


      /*
       * These files will be created next.
       */

      const [
        game,
        physics,
        store,
        customers
      ] = await Promise.all([

        import("./game.js"),

        import("./physics.js"),

        import("./store.js"),

        import("./customers.js")

      ]);


      setLoading(
        70,
        "Connecting systems..."
      );


      S.systems.game =
        game;

      S.systems.physics =
        physics;

      S.systems.store =
        store;

      S.systems.customers =
        customers;


      /*
       * Setup each system if it provides setup().
       */

      for (
        const system of [
          game,
          physics,
          store,
          customers
        ]
      ) {

        if (
          system &&
          typeof system.setup === "function"
        ) {

          await system.setup(
            S
          );

        }

      }


      setLoading(
        100,
        "Ready!"
      );


      S.loading = false;


      setTimeout(() => {

        loadingScreen.classList.add(
          "hidden"
        );

        mainMenu.classList.remove(
          "hidden"
        );

      }, 350);

    }


    /*
     * ---------------------------------------------------------
     * BOOT
     * ---------------------------------------------------------
     */

    async function boot() {

      try {

        setLoading(
          5,
          "Starting WebXR..."
        );


        createScene();


        setLoading(
          30,
          "Loading VR systems..."
        );


        await loadSystems();


        S.renderer.setAnimationLoop(
          gameLoop
        );

      }

      catch (error) {

        showError(error);

      }

    }


    /*
     * Start
     */

    boot();

  </script>

</body>
</html>
